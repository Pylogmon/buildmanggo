name: Package and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the draft release, for example 1.0.0 or 1.0.0-rc.1'
        required: true
        type: string
      skip_notarize:
        description: 'Skip Apple notarization for testing (keeps code signing)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Package all six platforms
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      MANGGO_RELEASE_VERSION: ${{ inputs.version }}
      MANGGO_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MANGGO_MACOS_CERTIFICATE_P12_BASE64 }}
      MANGGO_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MANGGO_MACOS_CERTIFICATE_PASSWORD }}
      MANGGO_MACOS_SIGN_IDENTITY: ${{ secrets.MANGGO_MACOS_SIGN_IDENTITY }}
      MANGGO_MACOS_NOTARY_APPLE_ID: ${{ secrets.MANGGO_MACOS_NOTARY_APPLE_ID }}
      MANGGO_MACOS_NOTARY_PASSWORD: ${{ secrets.MANGGO_MACOS_NOTARY_PASSWORD }}
      MANGGO_MACOS_NOTARY_TEAM_ID: ${{ secrets.MANGGO_MACOS_NOTARY_TEAM_ID }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Pylogmon/Manggo-mygo
          token: ${{ secrets.TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build, verify and upload draft release
        run: go run ./tools/release.go -build -publish -skip-notarize=${{ inputs.skip_notarize || false }}
